name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,serve]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  train-fd001:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: turbosensor download --data-dir data/raw
      - run: turbosensor train --config configs/fd001.yaml
      - run: python scripts/check_metrics.py artifacts/FD001/metrics.json lgbm 12.0
      - uses: actions/upload-artifact@v4
        with:
          name: fd001-model
          path: artifacts/FD001/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t turbosensor .
      - name: Smoke-test the API
        run: |
          docker run -d --rm -p 8000:8000 --name ts turbosensor
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' -d '{"readings":[{"unit":1,"cycle":1,"settings":[0,0,100],"sensors":[518.67,642.1,1589.7,1400.6,14.62,21.61,554.36,2388.06,9046.19,1.3,47.47,521.66,2388.02,8138.62,8.4195,0.03,392,2388,100.0,39.06,23.419]}]}'
          docker stop ts
