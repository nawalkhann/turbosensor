# Single operating condition, HPC and fan degradation.
subset: FD003
data_dir: data/raw
output_dir: artifacts
rul_cap: 125
windows: [5, 15, 30, 60]
cv_folds: 5
maintenance_horizon: 30
# Alert operating point is learned on out-of-fold predictions. A missed failure
# costs as much as 100 cycles of engine life; a false alarm costs the life it
# throws away (1 per cycle pulled early).
miss_cost: 100
false_alarm_cost: 1
# Average of 3 differently seeded boosted models.
n_seeds: 3
# Blend a 1D-CNN over the last 60 cycles into LightGBM; the blend weight is
# chosen on out-of-fold predictions (0 means the CNN is dropped). Needs [deep].
cnn:
  window: 60
  epochs: 40
seed: 0
models:
  ridge:
    alpha: 1.0
  lgbm:
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    reg_lambda: 10.0
